
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Latihan PTS Bahasa Arab Kelas VII</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#eef6ea;margin:0}
.container{max-width:700px;margin:auto;padding:20px}
.card{background:white;border-radius:20px;padding:22px;box-shadow:0 4px 12px rgba(0,0,0,.1)}
h1{color:#2e7d32;margin-top:0}
button{background:#2e7d32;color:white;border:none;padding:12px 20px;border-radius:10px;font-size:16px;cursor:pointer}
button:disabled{background:#bdbdbd}
.option{display:block;padding:12px;border:1px solid #ddd;border-radius:10px;margin:8px 0;cursor:pointer}
.option:hover{background:#f5fff5}
.progress{height:8px;background:#ddd;border-radius:10px;margin:15px 0}
.bar{height:100%;background:#2e7d32;border-radius:10px;width:0%}
.nav{display:flex;justify-content:space-between;margin-top:20px}
#timer{color:#c62828;font-weight:bold}
#result{text-align:center}
</style>
</head>
<body>

<div class="container">
<div class="card">

<div id="start">
<h1>📗 Latihan PTS Bahasa Arab Kelas VII</h1>
<p>Berdasarkan materi ASTS Semester Ganjil (versi latihan).</p>
<ul>
<li>35 Soal</li>
<li>45 Menit</li>
<li>Nilai otomatis</li>
</ul>
<button onclick="mulai()">Mulai Latihan</button>
</div>

<div id="quiz" style="display:none">
<div style="display:flex;justify-content:space-between;align-items:center">
<div id="nomor"></div>
<div id="timer">45:00</div>
</div>

<div class="progress"><div class="bar" id="bar"></div></div>

<h3 id="pertanyaan"></h3>

<div id="opsi"></div>

<div class="nav">
<button id="prev" onclick="prevSoal()">⬅ Sebelumnya</button>
<button id="next" onclick="nextSoal()">Berikutnya ➡</button>
</div>
</div>

<div id="result" style="display:none">
<h1>🎉 Selesai!</h1>
<h2 id="nilai"></h2>
<p id="benar"></p>
<button onclick="location.reload()">Ulangi</button>
</div>

</div>
</div>

<script>
const soal=[
{q:"Temanmu bertanya كيف حالك؟. Jawaban paling tepat adalah...",o:["أهلاً وسهلاً","بخير والحمد لله","مع السلامة","شكراً"],a:1},
{q:"Ungkapan 'Selamat pagi' dalam bahasa Arab adalah...",o:["مساء الخير","صباح الخير","إلى اللقاء","شكراً"],a:1},
{q:"Kalimat untuk mengucapkan terima kasih adalah...",o:["أهلاً وسهلاً","شكراً","مع السلامة","صباح الخير"],a:1},
{q:"Arti أهلاً وسهلاً adalah...",o:["Sampai jumpa","Selamat datang","Selamat malam","Terima kasih"],a:1},
{q:"Saat pulang sekolah, ungkapan yang tepat adalah...",o:["إلى اللقاء","شكراً","صباح الخير","أهلاً وسهلاً"],a:0},
{q:"Rafi diminta membuka ____ untuk membaca pelajaran.",o:["كتاب","قلم","كرسي","نافذة"],a:0},
{q:"Aisyah menulis dengan ____ berwarna hitam.",o:["كتاب","قلم","ورقة","باب"],a:1},
{q:"Guru meminta mengambil ورقة. Yang diambil adalah...",o:["Pulpen","Kertas","Kursi","Tas"],a:1},
{q:"Bel masuk berbunyi, siswa menuju ke...",o:["فصل","مطبخ","حمام","خزانة"],a:0},
{q:"Arti kata مكتب adalah...",o:["Sekolah","Kelas","Meja","Dapur"],a:2},
{q:"Jika مدرسة disambung dengan ها menjadi...",o:["مدرستها","مدرسها","مدرسةها","مدرسها"],a:0},
{q:"Kosakata bahasa Arab untuk pagi adalah...",o:["ليلاً","نهاراً","صباحاً","مساءً"],a:2},
{q:"Jawaban yang tepat untuk السلام عليكم adalah...",o:["صباح النور","وعليكم السلام","شكراً","أهلاً بك"],a:1},
{q:"Lengkapi dialog: كيف حالك؟ — ____",o:["الحمد لله بخير","مع السلامة","شكراً","أهلاً بك"],a:0},
{q:"Guru berkata kepada murid laki-laki: 'Ini bukumu.'",o:["كتابك","كتابه","كتابها","كتابي"],a:0},
{q:"Arti باب adalah...",o:["Jendela","Pintu","Meja","Kursi"],a:1},
{q:"Kosakata kursi adalah...",o:["كرسي","طاولة","كتاب","باب"],a:0},
{q:"Ungkapan salam sore adalah...",o:["صباح الخير","مساء الخير","إلى اللقاء","شكراً"],a:1},
{q:"Arti نافذة adalah...",o:["Jendela","Pintu","Tas","Kertas"],a:0},
{q:"Bentuk rumahnya (perempuan) adalah...",o:["بيتها","بيته","بيتك","بيتي"],a:0},
{q:"Kosakata tas sekolah adalah...",o:["حقيبة","ورقة","كتاب","باب"],a:0},
{q:"Bentuk pensilmu (perempuan) adalah...",o:["قلمكِ","قلمه","قلمي","قلمها"],a:0},
{q:"Arti فصل adalah...",o:["Sekolah","Kelas","Guru","Rumah"],a:1},
{q:"Kosakata guru adalah...",o:["طالب","معلم","كرسي","باب"],a:1},
{q:"Ungkapan menyambut tamu adalah...",o:["مع السلامة","أهلاً وسهلاً","شكراً","مساء الخير"],a:1},
{q:"Bentuk pintunya (laki-laki) adalah...",o:["بابه","بابها","بابك","بابي"],a:0},
{q:"Arti قلم adalah...",o:["Buku","Pulpen","Kertas","Tas"],a:1},
{q:"Kosakata siang adalah...",o:["نهاراً","ليلاً","مساءً","صباحاً"],a:0},
{q:"Bentuk kelasmu (perempuan) adalah...",o:["فصلكِ","فصلك","فصله","فصلها"],a:0},
{q:"Arti كتاب adalah...",o:["Meja","Buku","Jendela","Kursi"],a:1},
{q:"Bentuk teleponmu (laki-laki) adalah...",o:["هاتفك","هاتفه","هاتفها","هاتفي"],a:0},
{q:"Ungkapan mengakhiri percakapan adalah...",o:["إلى اللقاء","شكراً","صباح الخير","أهلاً وسهلاً"],a:0},
{q:"Kosakata malam adalah...",o:["ليلاً","نهاراً","صباحاً","مساءً"],a:0},
{q:"Bentuk bukunya (perempuan) adalah...",o:["كتابها","كتابه","كتابك","كتابي"],a:0},
{q:"Arti ورقة adalah...",o:["Buku","Pulpen","Kertas","Meja"],a:2}
];

let index=0;
let jawaban=new Array(35).fill(null);
let sisa=2700;
let interval;

function mulai(){
document.getElementById("start").style.display="none";
document.getElementById("quiz").style.display="block";
tampil();
interval=setInterval(timer,1000);
}

function timer(){
if(sisa<0){selesai();return;}
let m=Math.floor(sisa/60);
let d=sisa%60;
document.getElementById("timer").innerHTML=String(m).padStart(2,"0")+":"+String(d).padStart(2,"0");
sisa--;
}

function tampil(){
let s=soal[index];
document.getElementById("nomor").innerHTML="Soal "+(index+1)+" / 35";
document.getElementById("pertanyaan").innerHTML=s.q;
document.getElementById("bar").style.width=((index+1)/35*100)+"%";
let html="";
s.o.forEach((o,i)=>{
html+=`<label class="option">
<input type="radio" name="opsi" value="${i}" ${jawaban[index]==i?"checked":""}
onclick="jawaban[${index}]=${i}">
 ${String.fromCharCode(65+i)}. ${o}
</label>`;
});
document.getElementById("opsi").innerHTML=html;
document.getElementById("prev").disabled=index===0;
document.getElementById("next").innerHTML=index===34?"Selesai":"Berikutnya ➡";
}

function nextSoal(){
if(index===34){selesai();return;}
index++;
tampil();
}

function prevSoal(){
if(index>0){index--;tampil();}
}

function selesai(){
clearInterval(interval);
let benar=0;
jawaban.forEach((j,i)=>{if(j===soal[i].a)benar++;});
let nilai=Math.round(benar/35*100);
document.getElementById("quiz").style.display="none";
document.getElementById("result").style.display="block";
document.getElementById("nilai").innerHTML="Nilai: "+nilai+"/100";
document.getElementById("benar").innerHTML="Jawaban benar: "+benar+" dari 35 soal";
}
</script>

</body>
</html>
